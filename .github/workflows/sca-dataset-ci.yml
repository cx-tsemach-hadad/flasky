name: build-and-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SERVER_NAME: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install
        run: python -m pip install "setuptools<76" flask-script -r requirements/dev.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
